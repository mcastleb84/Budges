<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Ledger">
<meta name="theme-color" content="#5c7f66">
<title>Budget Ledger</title>

<style>
:root {
  --green: #5c7f66;
  --gold: #d49b27;
  --light-gold: #f4cb66;
  --border: #b37f19;
  --dark: #3a2203;
  --muted: #5e3d09;
  --deposit: #14532d;
  --withdrawal: #7f1d1d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: max(20px, env(safe-area-inset-top)) 15px 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: var(--green);
  background-image: radial-gradient(rgba(35,59,41,.25) 1.5px, transparent 1.5px);
  background-size: 16px 16px;
  color: var(--dark);
}

.app { max-width: 680px; margin: auto; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

header h1 { color: white; margin: 0; font-size: 26px; }
header p { color: #e5ece6; margin: 4px 0; font-size: 14px; }

.card {
  background: var(--gold);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 14px #0002;
}

h3 { margin: 0 0 12px; }

button, select, input {
  font: inherit;
  border-radius: 9px;
  padding: 10px;
  min-width: 0;
}

button {
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--light-gold);
  color: var(--dark);
  font-weight: 700;
}

button:disabled { opacity: .4; }

select, input {
  width: 100%;
  border: 1px solid var(--border);
  background: white;
  font-size: 16px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 5px;
}

.share-icon {
  width: 40px;
  height: 40px;
  background: #ffffff22;
  border: 1px solid #ffffff88;
  color: white;
  font-size: 23px;
}

.manage-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-items: end;
}

.manage-buttons {
  display: flex;
  gap: 4px;
}

.manage-buttons button {
  flex: 1;
  padding: 10px 2px;
  font-size: 11px;
  white-space: nowrap;
}

.timeframes {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  background: var(--light-gold);
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 14px;
}

.timeframes button {
  flex: 1;
  min-width: 60px;
  border: none;
  background: transparent;
  font-size: 12px;
  padding: 10px 4px;
}

.timeframes button.active {
  background: var(--dark);
  color: white;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.toolbar button { flex: 1; }

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.metric {
  background: var(--light-gold);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 5px;
  text-align: center;
  min-width: 0;
}

.metric small {
  display: block;
  font-size: 10px;
  font-weight: 800;
  margin-bottom: 7px;
}

.metric strong {
  font-size: clamp(12px, 3.5vw, 18px);
  overflow-wrap: anywhere;
}

.deposit { color: var(--deposit); }
.withdrawal { color: var(--withdrawal); }

.primary {
  width: 100%;
  background: var(--dark);
  color: white;
  padding: 13px;
  margin-bottom: 14px;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.ledger-heading {
  display: flex;
  justify-content: space-between;
  margin: 18px 0 10px;
  font-weight: 800;
}

.transaction {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  background: var(--light-gold);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.transaction .details {
  min-width: 0;
  overflow-wrap: anywhere;
}

.transaction h4 { margin: 0 0 4px; }
.transaction small { color: var(--muted); }
.transaction .right { text-align: right; flex-shrink: 0; }
.transaction .amount { font-weight: 800; }

.small-button {
  font-size: 11px;
  padding: 5px 7px;
  margin-top: 6px;
  background: white;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}

.modal {
  background: var(--gold);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
}

.field { margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions button { flex: 1; }

.hidden { display: none !important; }
.empty { text-align: center; padding: 20px; }
#status { font-size: 12px; margin-top: 10px; }

@media(max-width:390px) {
  .manage-buttons { flex-wrap: wrap; }
  .manage-buttons button { flex-basis: 40%; }
}

@media print {
  body { background: white; color: black; }
  header button, .toolbar, .timeframes,
  .manage-row, .filters, .primary,
  .small-button { display: none !important; }
  .card, .transaction, .metric {
    box-shadow: none;
    background: white;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>Budget Ledger</h1>
    <p>Expenses &amp; Cash Flow</p>
  </div>
  <button class="share-icon" id="shareButton"
    aria-label="Share Ledger">↥</button>
</header>

<section class="card">
  <div class="manage-row">
    <div>
      <label for="ledgerSelect">Current Ledger</label>
      <select id="ledgerSelect"></select>
    </div>
    <div>
      <label>Manage Ledgers</label>
      <div class="manage-buttons">
        <button id="newLedger">＋ New</button>
        <button id="renameLedger">✎ Rename</button>
        <button id="deleteLedger">🗑 Delete</button>
      </div>
    </div>
  </div>
</section>

<div class="timeframes">
  <button data-period="daily">Daily</button>
  <button data-period="weekly">Weekly</button>
  <button data-period="monthly" class="active">Monthly</button>
  <button data-period="yearly">Yearly</button>
  <button data-period="all">All-Time</button>
</div>

<div class="toolbar">
  <button id="undo" disabled>↶ Undo</button>
  <button id="redo" disabled>↷ Redo</button>
  <button id="clear">🗑 Clear All</button>
</div>

<div class="metrics">
  <div class="metric">
    <small>NET BALANCE</small>
    <strong id="net">$0.00</strong>
  </div>
  <div class="metric">
    <small>DEPOSITS (+)</small>
    <strong id="deposits" class="deposit">+$0.00</strong>
  </div>
  <div class="metric">
    <small>WITHDRAWALS (-)</small>
    <strong id="withdrawals" class="withdrawal">-$0.00</strong>
  </div>
</div>

<section class="card">
  <button class="primary" id="addTransaction">
    ＋ Add New Transaction
  </button>

  <div class="filters">
    <div>
      <label>Filter Dropdown</label>
      <select id="filterType">
        <option value="all">All Items</option>
        <option value="withdrawal">Withdrawals Only</option>
        <option value="deposit">Deposits Only</option>
      </select>
    </div>

    <div>
      <label>Sort Dropdown</label>
      <select id="sortOrder">
        <option value="newest">Date: Newest First</option>
        <option value="oldest">Date: Oldest First</option>
        <option value="highest">Amount: High to Low</option>
        <option value="lowest">Amount: Low to High</option>
        <option value="category">Category A-Z</option>
        <option value="description">Description A-Z</option>
      </select>
    </div>

    <div>
      <label>Expense Category</label>
      <select id="filterCategory">
        <option value="all">All Categories</option>
      </select>
    </div>

    <div>
      <label>Search Items</label>
      <input id="search" placeholder="Search transactions">
    </div>
  </div>

  <div class="ledger-heading">
    <span>Itemized Ledger</span>
    <span id="count">0 entries</span>
  </div>

  <div id="transactionList"></div>
  <p id="status" role="status"></p>
</section>
</div>

<!-- TRANSACTION WINDOW -->
<div id="transactionModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="transactionTitle">Add Transaction</h3>

    <form id="transactionForm">
      <div class="field">
        <label>Transaction Type</label>
        <select id="txType">
          <option value="withdrawal">Withdrawal (-)</option>
          <option value="deposit">Deposit (+)</option>
        </select>
      </div>

      <div class="field">
        <label>Item Description</label>
        <input id="txDescription" required maxlength="120"
          placeholder="Grocery Store, Electric Bill">
      </div>

      <div class="field">
        <label>Category</label>
        <select id="txCategory"></select>
      </div>

      <div class="field">
        <label>Amount ($)</label>
        <input id="txAmount" type="number"
          step="0.01" min="0.01" required>
      </div>

      <div class="field">
        <label>Date</label>
        <input id="txDate" type="date" required>
      </div>

      <div class="modal-actions">
        <button type="button" id="cancelTransaction">Cancel</button>
        <button type="submit">Save Entry</button>
      </div>
    </form>
  </div>
</div>

<!-- SHARE WINDOW -->
<div id="shareModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Share Ledger</h3>

    <button class="primary" id="printLedger">🖨 Print</button>
    <button class="primary" id="saveCSV">💾 Save CSV</button>
    <button class="primary" id="emailLedger">✉ Email</button>
    <button class="primary" id="textLedger">💬 Text</button>
    <button class="primary" id="nativeShare">↥ iPhone Share</button>
    <button class="primary" id="backupLedger">📥 Save Backup</button>
    <button class="primary" id="closeShare">Close</button>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const STORAGE_KEY = "budget-ledger-multiple-v1";

const categories = [
  "Housing", "Transportation", "Groceries",
  "Utilities", "Phone & Internet", "Credit Cards",
  "Dining", "Entertainment & Travel", "Medical",
  "Shopping", "Insurance", "Savings", "Paycheck", "Other"
];

const money = value =>
  new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD"
  }).format(value);

const today = () => {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
};

const newId = () =>
  Date.now().toString() + Math.random().toString(36).slice(2);

const escapeHTML = value =>
  String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));

let ledgers = [];
let activeId = "";
let period = "monthly";
let editingId = null;
let undoStack = [];
let redoStack = [];

function activeLedger() {
  return ledgers.find(l => l.id === activeId);
}

function transactions() {
  return activeLedger().transactions;
}

function initialize() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (saved && Array.isArray(saved.ledgers) && saved.ledgers.length) {
      ledgers = saved.ledgers;
      activeId = saved.activeId || saved.activeLedgerId;

      if (!ledgers.some(l => l.id === activeId)) {
        activeId = ledgers[0].id;
      }
    }
  } catch (error) {
    console.warn("Could not read saved ledgers.", error);
  }

  if (!ledgers.length) {
    let oldTransactions = [];

    try {
      const old = JSON.parse(localStorage.getItem("app_budget_tx"));
      if (Array.isArray(old)) oldTransactions = old;
    } catch (error) {}

    ledgers = [{
      id: newId(),
      name: "My Budget",
      transactions: oldTransactions
    }];

    activeId = ledgers[0].id;
  }

  for (const ledger of ledgers) {
    if (!Array.isArray(ledger.transactions)) {
      ledger.transactions = [];
    }

    ledger.transactions = ledger.transactions.map(t => ({
      ...t,
      desc: t.desc || t.description || "",
      category: t.category || "Other",
      amount: Number(t.amount) || 0
    }));
  }

  for (const category of categories) {
    $("txCategory").add(new Option(category, category));
    $("filterCategory").add(new Option(category, category));
  }

  renderAll();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      activeId,
      ledgers
    }));
    $("status").textContent = "Changes saved on this device.";
    return true;
  } catch (error) {
    $("status").textContent =
      "Unable to save. Check browser storage and export a backup.";
    return false;
  }
}

function remember() {
  undoStack.push(JSON.stringify(transactions()));
  redoStack = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  $("undo").disabled = !undoStack.length;
  $("redo").disabled = !redoStack.length;
}

function renderSelector() {
  $("ledgerSelect").innerHTML = "";

  ledgers.forEach(ledger => {
    $("ledgerSelect").add(new Option(ledger.name, ledger.id));
  });

  $("ledgerSelect").value = activeId;
}

function matchesPeriod(date) {
  if (period === "all") return true;

  const d = new Date(date + "T12:00:00");
  const now = new Date();

  if (isNaN(d.getTime())) return false;

  if (period === "daily") {
    return d.toDateString() === now.toDateString();
  }

  if (period === "weekly") {
    const start = new Date(now);
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - (start.getDay() + 6) % 7);

    const end = new Date(start);
    end.setDate(end.getDate() + 7);

    return d >= start && d < end;
  }

  if (period === "monthly") {
    return d.getMonth() === now.getMonth() &&
           d.getFullYear() === now.getFullYear();
  }

  if (period === "yearly") {
    return d.getFullYear() === now.getFullYear();
  }

  return true;
}

function renderTotals() {
  let deposits = 0;
  let withdrawals = 0;

  transactions().filter(t => matchesPeriod(t.date)).forEach(t => {
    if (t.type === "deposit") deposits += t.amount;
    else withdrawals += t.amount;
  });

  $("deposits").textContent = "+" + money(deposits);
  $("withdrawals").textContent = "-" + money(withdrawals);
  $("net").textContent = money(deposits - withdrawals);
}

function renderTransactions() {
  const type = $("filterType").value;
  const category = $("filterCategory").value;
  const sort = $("sortOrder").value;
  const search = $("search").value.toLowerCase();

  let items = transactions().filter(t =>
    matchesPeriod(t.date) &&
    (type === "all" || t.type === type) &&
    (category === "all" || t.category === category) &&
    (t.desc + " " + t.category).toLowerCase().includes(search)
  );

  items.sort((a, b) => {
    if (sort === "oldest") return a.date.localeCompare(b.date);
    if (sort === "highest") return b.amount - a.amount;
    if (sort === "lowest") return a.amount - b.amount;
    if (sort === "category") return a.category.localeCompare(b.category);
    if (sort === "description") return a.desc.localeCompare(b.desc);
    return b.date.localeCompare(a.date);
  });

  $("count").textContent = items.length + " entries";

  $("transactionList").innerHTML = items.length
    ? items.map(t => `
      <div class="transaction">
        <div class="details">
          <h4>${escapeHTML(t.desc)}</h4>
          <small>
            ${escapeHTML(t.date)} ·
            ${escapeHTML(t.category)} ·
            ${t.type.toUpperCase()}
          </small>
        </div>
        <div class="right">
          <div class="amount ${t.type}">
            ${t.type === "deposit" ? "+" : "-"}${money(t.amount)}
          </div>
          <button class="small-button" data-edit="${escapeHTML(t.id)}">
            Edit
          </button>
          <button class="small-button" data-delete="${escapeHTML(t.id)}">
            Delete
          </button>
        </div>
      </div>
    `).join("")
    : '<p class="empty">No transactions match your selection.</p>';
}

function renderAll() {
  renderSelector();
  renderTotals();
  renderTransactions();
  updateHistoryButtons();
}

function openTransaction(t = null) {
  editingId = t ? t.id : null;

  $("transactionTitle").textContent =
    t ? "Edit Transaction" : "Add Transaction";

  $("txType").value = t ? t.type : "withdrawal";
  $("txDescription").value = t ? t.desc : "";
  $("txCategory").value = t ? t.category : "Groceries";
  $("txAmount").value = t ? t.amount : "";
  $("txDate").value = t ? t.date : today();

  $("transactionModal").classList.remove("hidden");
}

function closeTransaction() {
  $("transactionModal").classList.add("hidden");
  editingId = null;
}

$("addTransaction").onclick = () => openTransaction();
$("cancelTransaction").onclick = closeTransaction;

$("transactionForm").onsubmit = event => {
  event.preventDefault();

  const desc = $("txDescription").value.trim();
  const amount = Number($("txAmount").value);
  const date = $("txDate").value;

  if (!desc || !date || !Number.isFinite(amount) || amount <= 0) {
    alert("Enter a valid transaction.");
    return;
  }

  const entry = {
    id: editingId || newId(),
    type: $("txType").value,
    desc,
    category: $("txCategory").value,
    amount: Math.round(amount * 100) / 100,
    date
  };

  remember();

  if (editingId) {
    activeLedger().transactions =
      transactions().map(t => t.id === editingId ? entry : t);
  } else {
    transactions().unshift(entry);
  }

  closeTransaction();
  save();
  renderAll();
};

$("transactionList").onclick = event => {
  const button = event.target.closest("button");
  if (!button) return;

  const id = button.dataset.edit || button.dataset.delete;
  const entry = transactions().find(t => t.id === id);

  if (!entry) return;

  if (button.dataset.edit) {
    openTransaction(entry);
  } else if (confirm("Delete this transaction?")) {
    remember();
    activeLedger().transactions =
      transactions().filter(t => t.id !== id);

    save();
    renderAll();
  }
};

$("undo").onclick = () => {
  if (!undoStack.length) return;

  redoStack.push(JSON.stringify(transactions()));
  activeLedger().transactions = JSON.parse(undoStack.pop());

  save();
  renderAll();
};

$("redo").onclick = () => {
  if (!redoStack.length) return;

  undoStack.push(JSON.stringify(transactions()));
  activeLedger().transactions = JSON.parse(redoStack.pop());

  save();
  renderAll();
};

$("clear").onclick = () => {
  if (!transactions().length) return;

  if (confirm("Clear all transactions in this ledger?")) {
    remember();
    activeLedger().transactions = [];
    save();
    renderAll();
  }
};

$("ledgerSelect").onchange = event => {
  activeId = event.target.value;
  undoStack = [];
  redoStack = [];

  save();
  renderAll();
};

$("newLedger").onclick = () => {
  const name = prompt("Enter a name for your new ledger:");
  if (name === null) return;

  const clean = name.trim();

  if (!clean || clean.length > 60) {
    alert("Enter a name between 1 and 60 characters.");
    return;
  }

  if (ledgers.some(l => l.name.toLowerCase() === clean.toLowerCase())) {
    alert("A ledger with that name already exists.");
    return;
  }

  const ledger = {
    id: newId(),
    name: clean,
    transactions: []
  };

  ledgers.push(ledger);
  activeId = ledger.id;
  undoStack = [];
  redoStack = [];

  save();
  renderAll();
};

$("renameLedger").onclick = () => {
  const ledger = activeLedger();
  const name = prompt("Rename this ledger:", ledger.name);

  if (name === null) return;

  const clean = name.trim();

  if (!clean || clean.length > 60) {
    alert("Enter a name between 1 and 60 characters.");
    return;
  }

  if (ledgers.some(l =>
    l.id !== ledger.id &&
    l.name.toLowerCase() === clean.toLowerCase()
  )) {
    alert("That ledger name already exists.");
    return;
  }

  ledger.name = clean;
  save();
  renderAll();
};

$("deleteLedger").onclick = () => {
  if (ledgers.length === 1) {
    alert("You must keep at least one ledger.");
    return;
  }

  const ledger = activeLedger();

  if (!confirm(
    `Permanently delete "${ledger.name}" and all its transactions?`
  )) return;

  ledgers = ledgers.filter(l => l.id !== activeId);
  activeId = ledgers[0].id;

  undoStack = [];
  redoStack = [];

  save();
  renderAll();
};

document.querySelectorAll("[data-period]").forEach(button => {
  button.onclick = () => {
    period = button.dataset.period;

    document.querySelectorAll("[data-period]").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    renderTotals();
    renderTransactions();
  };
});

["filterType", "filterCategory", "sortOrder", "search"].forEach(id => {
  $(id).addEventListener("input", renderTransactions);
});

// SHARING AND EXPORTING

const shareModal = $("shareModal");

$("shareButton").onclick = () =>
  shareModal.classList.remove("hidden");

$("closeShare").onclick = () =>
  shareModal.classList.add("hidden");

function summary() {
  const deposits = transactions()
    .filter(t => t.type === "deposit")
    .reduce((sum, t) => sum + t.amount, 0);

  const withdrawals = transactions()
    .filter(t => t.type === "withdrawal")
    .reduce((sum, t) => sum + t.amount, 0);

  return [
    "Budget Ledger: " + activeLedger().name,
    "Deposits: " + money(deposits),
    "Withdrawals: " + money(withdrawals),
    "Net Balance: " + money(deposits - withdrawals),
    "Transactions: " + transactions().length
  ].join("\n");
}

function csv() {
  const rows = [
    ["Date", "Type", "Description", "Category", "Amount"],
    ...transactions().map(t => [
      t.date, t.type, t.desc, t.category, t.amount.toFixed(2)
    ])
  ];

  return rows.map(row =>
    row.map(value =>
      '"' + String(value).replace(/"/g, '""') + '"'
    ).join(",")
  ).join("\r\n");
}

function download(content, mime, extension) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download =
    activeLedger().name.replace(/[^a-z0-9-_]/gi, "-") +
    "." + extension;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

$("saveCSV").onclick = () =>
  download(csv(), "text/csv;charset=utf-8", "csv");

$("backupLedger").onclick = () =>
  download(
    JSON.stringify(activeLedger(), null, 2),
    "application/json",
    "json"
  );

$("emailLedger").onclick = () => {
  location.href =
    "mailto:?subject=" +
    encodeURIComponent("Budget Ledger: " + activeLedger().name) +
    "&body=" +
    encodeURIComponent(summary() + "\n\n" + csv());
};

$("textLedger").onclick = () => {
  location.href = "sms:?&body=" + encodeURIComponent(summary());
};

$("printLedger").onclick = () => {
  shareModal.classList.add("hidden");
  window.print();
};

$("nativeShare").onclick = async () => {
  if (!navigator.share) {
    alert("Sharing is not supported in this browser.");
    return;
  }

  try {
    const file = new File(
      [csv()],
      "budget-ledger.csv",
      { type: "text/csv" }
    );

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: activeLedger().name,
        text: summary(),
        files: [file]
      });
    } else {
      await navigator.share({
        title: activeLedger().name,
        text: summary()
      });
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      alert("Unable to share this ledger.");
    }
  }
};

initialize();
</script>
</body>
</html>
